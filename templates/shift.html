<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <meta name="robots" content="none">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" sizes="400x400" href="/icon_ms.png">
    <link rel="manifest" href="/ms/manifest.json">
    <meta name="theme-color" content="#000000">
    <style type="text/css">
        body, html {
            padding: 0;
            margin: 0;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            overflow-y: visible;
            touch-action: pan-y;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 10px;
        }
        @media (max-width: 260px) {
            body, html { font-size: 8px; }
        }
        body.no-scroll {
            overflow: hidden !important;
        }

        /* --- 告知ボックス --- */
        #notificationBox {
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 6px 10px;
            background-color: rgba(68, 68, 68, 0.7);
            color: #fff;
            z-index: 99;
            font-size: 1.3em;
            font-weight: normal;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        /* --- 告知ボックス --- */

        #scrollframe {
            display: block;
            width: 100%;
        }
        #content {
            display: block;
            width: 100%;
            text-align: center;
            will-change: transform;
            padding-bottom: 50px;
        }
        #dateData {
            font-size: clamp(1.1em, 5vw, 1.8em);
            line-height: 0.9;
            padding-top: 20px;
        }
        #shiftData {
            display: inline-block;
            text-align: left;
            font-size: clamp(1.3em, 6vw, 2em);
            line-height: 1.2;
        }
        .group {
            margin-top: 8px;
        }
        .blur {
            font-size: 0.7em;
            color: #888;
        }
        .pickup {
            color: #FF7D81;
            font-weight: bold;
            font-size: 1.1em;
        }
        #w_hakui { color: #FFFFFF; }
        #b_hakui { color: #64C0FA; }
        .name {
            display: inline-block;
            padding: 2px 15px;
            touch-action: manipulation;
        }
        #button {
            z-index: 5;
            position: fixed;
            top: 70vh;
            left: 50%;
            height: 100vh;
            transform: translate(-50%, -50%);
            display: none;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #000;
            font-weight: bold;
            transform: translate(-50%, -50%);
            touch-action: manipulation;
        }
        .now {
            z-index: 3;
            position: relative;
            top: 0;
            left: 0;
            width: min(50vh, 50vw);
            height: min(50vh, 50vw);
            transform: none;
            background: #FFA733;
            font-size: min(21vh, 21vw);
        }
        .r_b {
            z-index: 2;
            top: min(70vh, 70vw);
            left: min(60vh, 60vw);
            width: min(50vh, 50vw);
            height: min(50vh, 50vw);
            background: #F0F0F0;
            font-size: min(17vh, 17vw);
        }
        .l_b {
            z-index: 1;
            top: min(70vh, 70vw);
            left: calc(100% - min(60vh, 60vw));
            width: min(50vh, 50vw);
            height: min(50vh, 50vw);
            background: #F0F0F0;
            font-size: min(17vh, 17vw);
        }
        .r_b span, .l_b span {
            display: inline-block;
            position: relative;
            top: -4vh;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
        }
        #modal-content {
            position: absolute;
            top: 10vh;
            top: 10dvh;
            left: 50%;
            width: 94vw;
            max-width: 630px;
            max-height: 80vh;
            max-height: 80dvh;
            transform: translateX(-50%);
            background: #222;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        @media (max-width: 400px), (max-height: 600px) {
            #modal-content {
                top: 5vh;
                top: 5dvh;
                max-height: 90vh;
                max-height: 90dvh;
            }
        }
        #modal-title {
            font-size: clamp(1.3em, 4.5vw, 1.8em);
            color: #ddd;
            margin: 5px 0 5px 0;
            text-align: center;
            font-weight: bold;
            position: relative;
        }

        .modal-range {
            position: absolute;
            left: 15px;
            bottom: -2px;
            font-size: 0.9em;
            color: #aaa;
            font-weight: normal;
            line-height: 1.1;
            text-align: left;
        }
        .modal-range.current {
            color: #FF7D81;
            font-weight: bold;
        }
        #modal-calendar {
            width: 98%;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: clamp(1em, 3.2vw, 1.4em);
            table-layout: fixed;
        }
        #modal-calendar th, #modal-calendar td {
            border: 1px solid #555;
            width: 14.28%;
        }
        #modal-calendar th {
            background-color: #333;
            height: 26px;
            font-weight: normal;
            text-align: center;
            vertical-align: middle;
        }
        #modal-calendar td {
            padding: 0;
            vertical-align: middle;
        }
        .cal-cell-inner {
            position: relative;
            width: 100%;
            height: clamp(30px, 8vh, 50px);
        }
        .cal-date {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: clamp(1.3em, 4vw, 1.5em);
            color: #aaa;
            line-height: 1;
        }
        .cal-shift {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-30%, -50%);
            font-size: clamp(1.7em, 6vw, 2.3em);
            font-weight: bold;
            color: #fff;
            line-height: 1;
            white-space: nowrap;
        }
        .cal-shift.small-text {
            font-size: clamp(1.1em, 4vw, 1.5em);
            transform: translate(-35%, -50%);
        }
        .cal-shift.micro-text {
            font-size: clamp(0.75em, 2.5vw, 1.1em);
            transform: translate(-45%, -50%);
        }
        .cal-today {
            background-color: #333;
            box-shadow: inset 0 0 12px rgba(255, 125, 129, 0.8);
        }
        .cal-today .cal-date {
            color: #FF7D81;
            font-weight: bold;
        }
        .cal-out-of-range {
            background-color: #121212;
        }
        #modal-close {
            position: absolute;
            top: 5px;
            right: 15px;
            font-size: 26px;
            color: #f00;
            cursor: pointer;
            padding: 0 10px;
            line-height: 1;
            z-index: 10;
            touch-action: manipulation;
        }
        #modal-close:active {
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- --- 告知ボックス --- -->
    <div id="notificationBox">名前をダブルタップすると・・・</div>
    <!-- --- 告知ボックス --- -->

    <div id="button">
        <div class="circle now">現在</div>
        <div class="circle r_b"><span>+7日</span></div>
        <div class="circle l_b"><span>-7日</span></div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <div id="modal-close">×</div>
            <div id="modal-title"></div>
            <table id="modal-calendar">
                <thead>
                    <tr>
                        <th style="color:#FF7D81;">日</th>
                        <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th>
                        <th style="color:#64C0FA;">土</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div id="scrollframe">
        <div id="content">
            <div id="dateData"></div>
            <div id="shiftData"></div>
        </div>
    </div>

    <script>
    const cache = new Map();
    const maxCacheSize = 30;
    const CACHE_EXPIRE_MS = 60 * 60 * 1000;
    const STOCK_DAYS = 9;
    const MODAL_OPEN_GUARD_MS = 350;
    const DOUBLE_TAP_ZOOM_WINDOW = 350;
    const DOUBLE_TAP_ZOOM_Y_TOLERANCE = 25;
    const DOUBLE_TAP_THRESHOLD = 300;
    const SWIPE_THRESHOLD = 30;
    const LONG_PRESS_DURATION = 1000;
    const MOVE_THRESHOLD = 10;
    const TAP_TIME_THRESHOLD = 300;
    const MODAL_SWIPE_THRESHOLD = 30;
    const MODAL_MOVE_THRESHOLD = 10;
    const MODAL_TAP_TIME_THRESHOLD = 300;

    let lastViewTime = Date.now();
    let G_current = 0;
    let modalOpenTime = 0;

    const dateArea = document.getElementById('dateData');
    const contentArea = document.getElementById('shiftData');
    const buttonLayer = document.getElementById('button');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const modalTitle = document.getElementById('modal-title');
    const modalTbody = document.querySelector('#modal-calendar tbody');
    const modalCloseBtn = document.getElementById('modal-close');
    const inPresent = document.getElementById('content');
    const parseTpl = document.createElement('template');

    function appendParsedHTML(target, html) {
        parseTpl.innerHTML = html;
        target.appendChild(parseTpl.content);
    }

    function fmtYMD(d) {
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseDateStr(str) {
        return new Date(+str.slice(0, 4), +str.slice(4, 6) - 1, +str.slice(6, 8));
    }

    function stripParens(name) {
        return name.replace(/[(（][^)）]*[)）]/g, '').trim();
    }

    function trimCache(mode) {
        if (mode === undefined) {
            if (cache.size > maxCacheSize) cache.delete(cache.keys().next().value);
            return;
        }
        if (cache.size >= maxCacheSize) {
            const keys = Array.from(cache.keys()).sort();
            cache.delete(mode ? keys[keys.length - 1] : keys[0]);
        }
    }

    async function fetchShift(address) {
        if (cache.has(address)) return cache.get(address);

        try {
            const response = await fetch(`../shift/${address}`);
            if (!response.ok) throw new Error(`Network response was not ok ${response.statusText}`);

            const data = await response.json();
            if (!data.shift) return 'shift not found';

            cache.set(address, data.shift);
            trimCache();
            return data.shift;
        } catch (error) {
            console.error(error);
            throw error;
        }
    }

    function getPresent(dayPlus, t = 0) {
        const d = new Date();
        d.setDate(d.getDate() + dayPlus);
        if (t !== 0) return `${d.getHours()}${String(d.getMinutes()).padStart(2, '0')}`;
        d.setHours(d.getHours() - 8);
        return fmtYMD(d);
    }

    function shiftWork(currentTimeNum, todayStr, yesterdayStr) {
        const activeShifts = {};

        if (currentTimeNum >= 900 && currentTimeNum < 2100) activeShifts['A'] = todayStr;
        if (currentTimeNum >= 2100 || currentTimeNum < 800) activeShifts['C'] = todayStr;
        if (currentTimeNum >= 800 && currentTimeNum < 900) activeShifts['C'] = yesterdayStr;

        if (currentTimeNum >= 1450) {
            activeShifts['2'] = todayStr;
            activeShifts['-2'] = todayStr;
        }
        if (currentTimeNum >= 2350 || currentTimeNum < 800) {
            activeShifts['3'] = todayStr;
            activeShifts['-3'] = todayStr;
        }
        if (currentTimeNum >= 800 && currentTimeNum < 900) {
            activeShifts['3'] = yesterdayStr;
            activeShifts['-3'] = yesterdayStr;
        }

        if (currentTimeNum >= 800 && currentTimeNum < 1710) activeShifts['1'] = todayStr;
        if (currentTimeNum >= 1150 && currentTimeNum < 2100) activeShifts['A2'] = todayStr;

        return activeShifts;
    }

    async function mainWrite(current = 0) {
        const now = Date.now();
        if (now - lastViewTime >= CACHE_EXPIRE_MS) cache.clear();
        lastViewTime = now;

        const todayStr = getPresent(0);
        const yesterdayStr = getPresent(-1);
        const currentTimeNum = parseInt(getPresent(0, 1), 10);

        try {
            const shiftArray = await fetchShift(getPresent(current));
            if (shiftArray === 'shift not found') {
                dateArea.textContent = '';
                contentArea.textContent = 'データがありません';
                return;
            }

            dateArea.innerHTML = '';
            const dateFragment = document.createDocumentFragment();
            const isToday = todayStr === shiftArray.index_day;
            const daysTarget = isToday ? document.createElement('span') : dateFragment;
            if (isToday) daysTarget.className = 'pickup';
            if (shiftArray.days) appendParsedHTML(daysTarget, shiftArray.days);
            if (isToday) dateFragment.appendChild(daysTarget);
            if (shiftArray.color) appendParsedHTML(dateFragment, shiftArray.color);
            dateArea.appendChild(dateFragment);

            const shiftFragment = document.createDocumentFragment();
            const data = JSON.parse(shiftArray.member);
            const order = ["有", "A", "B", "C", "2", "3", "1"];
            const keyNames = {
                "A": "A勤務", "A2": "A2", "B": "B勤務", "C": "C勤務",
                "1": "早番", "2": "中番", "-2": "中番応援", "3": "夜勤", "-3": "夜勤応援",
            };

            const activeShifts = shiftWork(currentTimeNum, todayStr, yesterdayStr);
            const dataDateStr = String(shiftArray.index_day);
            const dataKeys = Object.keys(data);
            const displayKeys = [...dataKeys.filter(key => !order.includes(key)), ...order.filter(key => data[key])];
            const hasNamedShift = dataKeys.some(key => key in keyNames && Array.isArray(data[key]) && data[key].length > 0);

            if (!hasNamedShift) {
                const yasumiDiv = document.createElement('div');
                yasumiDiv.className = "group";
                yasumiDiv.innerHTML = "★★★休み★★★<br>";
                shiftFragment.appendChild(yasumiDiv);
            }

            for (const key of displayKeys) {
                const isNamed = key in keyNames;
                const displayKey = isNamed ? keyNames[key] : key;
                const mark = isNamed ? "■■■" : "□□□";

                const groupDiv = document.createElement('div');
                groupDiv.className = (activeShifts[key] === dataDateStr) ? "group pickup" : "group";
                groupDiv.innerHTML = `${mark}[ ${displayKey} ]${mark}<br>`;

                if (Array.isArray(data[key])) {
                    data[key].forEach(member => {
                        groupDiv.appendChild(document.createTextNode(' '));
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'name';
                        nameSpan.textContent = member;
                        groupDiv.appendChild(nameSpan);
                        groupDiv.appendChild(document.createElement('br'));
                    });
                }
                shiftFragment.appendChild(groupDiv);
            }

            contentArea.innerHTML = '';
            contentArea.appendChild(shiftFragment);

            setTimeout(() => {
                window.scrollTo(0, 0);
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
            }, 10);

        } catch (error) {
            contentArea.textContent = 'Error loading shift data';
        }

        for (let i = current - STOCK_DAYS; i <= current + STOCK_DAYS; i++) {
            if (i === current) continue;
            const dateStr = getPresent(i);
            if (!cache.has(dateStr)) fetchShift(dateStr).catch(() => {});
        }
    }

    function initButtons() {
        const handlePress = (event) => {
            const target = event.target.closest('.circle');
            if (!target) return;
            event.preventDefault();

            if (target.classList.contains('now')) G_current = 0;
            else if (target.classList.contains('r_b')) G_current += 7;
            else if (target.classList.contains('l_b')) G_current -= 7;
            else return;

            mainWrite(G_current);
        };

        buttonLayer.addEventListener('mouseup', handlePress);
        buttonLayer.addEventListener('touchend', handlePress);
    }

    function renderModalCalendar(data, name) {
        modalTbody.innerHTML = '';

        if (!data || Object.keys(data).length === 0) {
            modalTitle.textContent = `${name} (データなし)`;
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 7;
            td.style.textAlign = 'center';
            td.style.verticalAlign = 'middle';
            td.textContent = "データがありません";
            tr.appendChild(td);
            modalTbody.appendChild(tr);
            return;
        }

        const keys = Object.keys(data).sort();
        const firstDate = parseDateStr(keys[0]);
        const lastDate = parseDateStr(keys[keys.length - 1]);
        
        const fYear = firstDate.getFullYear();
        const fMonth = firstDate.getMonth() + 1;
        const lMonth = lastDate.getMonth() + 1;
        
        const yearText = `${fYear}年`;
        const rangeText = (fMonth === lMonth) ? `${fMonth}月` : `${fMonth}月～${lMonth}月`;

        const todayStr = getPresent(0);
        const rangeClass = data.hasOwnProperty(todayStr) ? "modal-range current" : "modal-range";
        
        modalTitle.innerHTML = `${name}<span class="${rangeClass}"><span class="blur">${yearText}</span><br>${rangeText}</span>`;

        const currentDate = new Date(firstDate);
        currentDate.setDate(firstDate.getDate() - firstDate.getDay());

        const rowFragment = document.createDocumentFragment();

        for (let row = 0; row < 6; row++) {
            const tr = document.createElement('tr');

            for (let col = 0; col < 7; col++) {
                const td = document.createElement('td');
                const dateKey = fmtYMD(currentDate);
                const innerDiv = document.createElement('div');
                innerDiv.className = 'cal-cell-inner';

                if (data.hasOwnProperty(dateKey)) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'cal-date';
                    dateDiv.textContent = currentDate.getDate();
                    innerDiv.appendChild(dateDiv);

                    const shiftText = data[dateKey];
                    const shiftDiv = document.createElement('div');
                    shiftDiv.className = 'cal-shift';
                    shiftDiv.textContent = shiftText;

                    const textLength = Array.from(shiftText).length;
                    if (textLength >= 4) shiftDiv.classList.add('micro-text');
                    else if (textLength >= 2) shiftDiv.classList.add('small-text');
                    innerDiv.appendChild(shiftDiv);
                } else {
                    td.classList.add('cal-out-of-range');
                }

                if (dateKey === todayStr) td.classList.add('cal-today');

                td.appendChild(innerDiv);
                tr.appendChild(td);
                currentDate.setDate(currentDate.getDate() + 1);
            }

            rowFragment.appendChild(tr);
            if (currentDate > lastDate) break;
        }
        modalTbody.appendChild(rowFragment);
    }

    async function loadModalMonth(dateStr, name) {
        try {
            const response = await fetch(`/shift/${dateStr}?name=${encodeURIComponent(name)}`);
            if (!response.ok) throw new Error("Network error");
            const data = await response.json();
            renderModalCalendar(data, name);
        } catch (error) {
            renderModalCalendar(null, name);
        }
    }

    function getShiftMonthStart(dateStr) {
        const d = parseDateStr(dateStr);
        return new Date(d.getFullYear(), d.getMonth() - (d.getDate() < 16 ? 1 : 0), 16);
    }

    (function() {
        // --- 告知ボックス ---
        setTimeout(() => {
            const nb = document.getElementById('notificationBox');
            if (nb) {
                nb.style.opacity = '0';
                setTimeout(() => {
                    nb.style.display = 'none';
                }, 300);
            }
        }, 3500);
        // --- 告知ボックス ---

        let isSwiping = false, startX, currentX, longPressTimer = null, hasMoved = false, startTime = 0, tappedElement = null, isLongPress = false;

        let lastTapTime = 0;
        let lastTappedElement = null;

        let zoomTouchStart = { x: 0, y: 0, moved: false };
        let lastStationaryTap = { time: 0, y: 0, valid: false };

        document.addEventListener('touchstart', function(e) {
            const t = e.touches[0];
            if (!t) return;

            zoomTouchStart.x = t.clientX;
            zoomTouchStart.y = t.clientY;
            zoomTouchStart.moved = false;

            const now = Date.now();
            const dy = Math.abs(t.clientY - lastStationaryTap.y);

            if (lastStationaryTap.valid &&
                (now - lastStationaryTap.time) <= DOUBLE_TAP_ZOOM_WINDOW &&
                dy <= DOUBLE_TAP_ZOOM_Y_TOLERANCE) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            const t = e.touches[0];
            if (!t) return;

            if (Math.abs(t.clientY - zoomTouchStart.y) > 10) {
                zoomTouchStart.moved = true;
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            const t = e.changedTouches[0];
            if (!t) return;

            if (zoomTouchStart.moved) {
                lastStationaryTap.valid = false;
                return;
            }

            const now = Date.now();
            const dy = Math.abs(t.clientY - lastStationaryTap.y);

            if (lastStationaryTap.valid &&
                (now - lastStationaryTap.time) <= DOUBLE_TAP_ZOOM_WINDOW &&
                dy <= DOUBLE_TAP_ZOOM_Y_TOLERANCE) {
                e.preventDefault();
            }

            lastStationaryTap = { time: now, y: t.clientY, valid: true };
        }, { passive: false });

        mainWrite();
        initButtons();

        let modalStartX, modalStartY, modalStartTime, modalMoved = false;
        let isModalSwiping = false, isModalVerticalScroll = false;

        let currentModalBaseDate = null;
        let currentModalName = "";

        async function animateModalSwipe(direction, targetDateStr) {
            const width = window.innerWidth;

            modalContent.style.transition = 'transform 0.15s ease-in';
            modalContent.style.transform = `translateX(calc(-50% + ${direction * width}px))`;

            await new Promise(resolve => setTimeout(resolve, 150));

            modalTitle.textContent = `${currentModalName} のデータを取得中...`;
            modalTbody.innerHTML = '';
            await loadModalMonth(targetDateStr, currentModalName);

            modalContent.style.transition = 'none';
            modalContent.style.transform = `translateX(calc(-50% + ${-direction * width}px))`;

            modalContent.offsetHeight;

            modalContent.style.transition = 'transform 0.15s cubic-bezier(0, 1.17, 0.86, 0.99)';
            modalContent.style.transform = 'translateX(-50%)';
        }

        async function handleTap(element) {
            if (!element.closest('.circle')) {
                buttonLayer.style.display = 'none';
            }

            if (element.classList.contains('name')) {
                const now = Date.now();
                if (now - lastTapTime < DOUBLE_TAP_THRESHOLD && now - lastTapTime > 50 && element === lastTappedElement) {

                    lastTapTime = 0;

                    const name = stripParens(element.textContent);
                    const indexDay = getPresent(G_current);

                    currentModalBaseDate = getShiftMonthStart(indexDay);
                    currentModalName = name;

                    modalTitle.textContent = `${name} のデータを取得中...`;
                    modalTbody.innerHTML = '';
                    modalOverlay.style.display = 'block';
                    document.body.classList.add('no-scroll');
                    modalOpenTime = Date.now();

                    await loadModalMonth(indexDay, name);
                } else {
                    lastTapTime = now;
                    lastTappedElement = element;
                }
            }
        }

        async function animateSwipe(direction) {
            const width = window.innerWidth;
            inPresent.style.transition = 'transform 0.15s ease-in';
            inPresent.style.transform = `translateX(${direction * width}px)`;

            await new Promise(resolve => setTimeout(resolve, 50));
            await mainWrite(G_current);

            inPresent.style.transition = 'none';
            inPresent.style.transform = `translateX(${-direction * width}px)`;

            inPresent.offsetHeight;

            inPresent.style.transition = 'transform 0.15s cubic-bezier(0, 1.17, 0.86, 0.99)';
            inPresent.style.transform = 'translateX(0px)';
        }

        function handleLongPress() {
            buttonLayer.style.display = 'block';
        }

        function resetSwipeState() {
            isSwiping = false;
            hasMoved = false;
            isLongPress = false;
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function handleStart(e) {
            if (document.body.classList.contains('no-scroll')) return;

            startX = e.touches ? e.touches[0].clientX : e.clientX;
            currentX = startX;
            startTime = Date.now();
            isSwiping = true;
            hasMoved = false;
            isLongPress = false;
            tappedElement = e.target;
            inPresent.style.transition = 'none';

            longPressTimer = setTimeout(() => {
                if (!hasMoved) {
                    isLongPress = true;
                    handleLongPress();
                }
            }, LONG_PRESS_DURATION);
        }

        function handleMove(e) {
            if (!isSwiping) return;
            currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const distance = Math.abs(currentX - startX);

            if (distance > MOVE_THRESHOLD && !hasMoved) {
                hasMoved = true;
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }
            inPresent.style.transform = `translateX(${currentX - startX}px)`;
        }

        function handleEnd(e) {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            if (!isSwiping) return;

            isSwiping = false;
            currentX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const distance = Math.abs(currentX - startX);
            const duration = Date.now() - startTime;

            if (distance < MOVE_THRESHOLD && duration < TAP_TIME_THRESHOLD && !isLongPress) {
                inPresent.style.transition = 'transform 0.1s ease';
                inPresent.style.transform = 'translateX(0px)';
                handleTap(tappedElement);
            }
            else if (isLongPress) {
                inPresent.style.transition = 'transform 0.1s ease';
                inPresent.style.transform = 'translateX(0px)';
            }
            else {
                buttonLayer.style.display = 'none';

                const realDistance = currentX - startX;
                if (realDistance > SWIPE_THRESHOLD) {
                    G_current--;
                    trimCache(true);
                    animateSwipe(1);
                } else if (realDistance < -SWIPE_THRESHOLD) {
                    G_current++;
                    trimCache(false);
                    animateSwipe(-1);
                } else {
                    inPresent.style.transition = 'transform 0.2s cubic-bezier(0, 1.17, 0.86, 0.99)';
                    inPresent.style.transform = 'translateX(0px)';
                }
            }
        }

        document.addEventListener('mousedown', handleStart, { passive: true });
        document.addEventListener('mousemove', handleMove, { passive: true });
        document.addEventListener('mouseup', handleEnd, { passive: true });
        document.addEventListener('mouseleave', resetSwipeState, { passive: true });

        document.addEventListener('touchstart', handleStart, { passive: true });
        document.addEventListener('touchmove', handleMove, { passive: true });
        document.addEventListener('touchend', handleEnd, { passive: true });
        document.addEventListener('touchcancel', resetSwipeState, { passive: true });

        function modalHandleStart(e) {
            modalStartX = e.touches ? e.touches[0].clientX : e.clientX;
            modalStartY = e.touches ? e.touches[0].clientY : e.clientY;
            modalStartTime = Date.now();
            modalMoved = false;
            isModalSwiping = false;
            isModalVerticalScroll = false;

            if (e.target.closest('#modal-content')) {
                modalContent.style.transition = 'none';
            }
        }

        function modalHandleMove(e) {
            if (modalStartX === undefined) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = cx - modalStartX;
            const dy = cy - modalStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (absDx > MODAL_MOVE_THRESHOLD || absDy > MODAL_MOVE_THRESHOLD) {
                modalMoved = true;
            }

            if (!e.target.closest('#modal-content')) {
                if (e.cancelable) e.preventDefault();
                return;
            }

            if (!isModalSwiping && !isModalVerticalScroll) {
                if (absDx > MODAL_MOVE_THRESHOLD && absDx > absDy) {
                    isModalSwiping = true;
                } else if (absDy > MODAL_MOVE_THRESHOLD) {
                    isModalVerticalScroll = true;
                }
            }

            if (isModalSwiping) {
                if (e.cancelable) e.preventDefault();
                modalContent.style.transform = `translateX(calc(-50% + ${dx}px))`;
            }
        }

        async function modalHandleEnd(e) {
            if (modalStartX === undefined) return;
            const duration = Date.now() - modalStartTime;
            const justOpened = Date.now() - modalOpenTime < MODAL_OPEN_GUARD_MS;
            const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const realDistance = cx - modalStartX;

            if (!e.target.closest('#modal-content')) {
                if (!modalMoved && duration < MODAL_TAP_TIME_THRESHOLD && !justOpened) {
                    modalOverlay.style.display = 'none';
                    document.body.classList.remove('no-scroll');
                    modalContent.style.transition = 'none';
                    modalContent.style.transform = 'translateX(-50%)';
                }
                modalStartX = undefined;
                return;
            }

            if (isModalSwiping) {
                if (realDistance > MODAL_SWIPE_THRESHOLD) {
                    currentModalBaseDate.setMonth(currentModalBaseDate.getMonth() - 1);
                    await animateModalSwipe(1, fmtYMD(currentModalBaseDate));
                } else if (realDistance < -MODAL_SWIPE_THRESHOLD) {
                    currentModalBaseDate.setMonth(currentModalBaseDate.getMonth() + 1);
                    await animateModalSwipe(-1, fmtYMD(currentModalBaseDate));
                } else {
                    modalContent.style.transition = 'transform 0.2s cubic-bezier(0, 1.17, 0.86, 0.99)';
                    modalContent.style.transform = 'translateX(-50%)';
                }
            }

            isModalSwiping = false;
            isModalVerticalScroll = false;
            modalStartX = undefined;
        }

        function modalHandleCancel() {
            modalStartX = undefined;
            modalMoved = false;
            isModalSwiping = false;
            isModalVerticalScroll = false;
            modalContent.style.transition = 'transform 0.2s cubic-bezier(0, 1.17, 0.86, 0.99)';
            modalContent.style.transform = 'translateX(-50%)';
        }

        modalOverlay.addEventListener('mousedown', modalHandleStart, { passive: true });
        modalOverlay.addEventListener('mousemove', modalHandleMove, { passive: false });
        modalOverlay.addEventListener('mouseup', modalHandleEnd, { passive: true });
        modalOverlay.addEventListener('mouseleave', modalHandleCancel, { passive: true });

        modalOverlay.addEventListener('touchstart', modalHandleStart, { passive: true });
        modalOverlay.addEventListener('touchmove', modalHandleMove, { passive: false });
        modalOverlay.addEventListener('touchend', modalHandleEnd, { passive: true });
        modalOverlay.addEventListener('touchcancel', modalHandleCancel, { passive: true });

        function closeModal(e) {
            if (e.cancelable) e.preventDefault();
            modalOverlay.style.display = 'none';
            document.body.classList.remove('no-scroll');
            modalContent.style.transition = 'none';
            modalContent.style.transform = 'translateX(-50%)';
        }
        modalCloseBtn.addEventListener('click', closeModal);
        modalCloseBtn.addEventListener('touchend', closeModal);

    })();
    </script>
</body>
